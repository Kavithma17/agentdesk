[project]
name = "agentdesk"
version = "0.1.0"
description = "Multilingual AI customer-support agent for small businesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "chromadb>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
